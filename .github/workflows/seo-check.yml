name: CI (tests, lint, build, rendered SEO)
# Pushing main deploys production through Vercel, so this is the only automated check that
# runs before customers see a change. It runs the checkout handler tests (mocked Clover and
# Neon — no network or secrets needed), lint and type checks, then the full production build
# with its price, CSP and SEO gates. To make it BLOCK a bad deploy, mark this check required
# (branch protection on main, or Vercel Deployment Checks) — see README "Development and release".
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
